# GitOps wiring: Flux follows the deploy-main tag that release.yml publishes on every merge to main.
# The artifact is deploy/base with newTag set to the merge commit, stored in the public web package.
# Applied once by hand (no `flux bootstrap`, so no write token and no direct pushes to main).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: portofolio
  namespace: flux-system
spec:
  interval: 1m
  url: oci://ghcr.io/resource008/portofolio-web
  ref:
    tag: deploy-main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portofolio
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: OCIRepository
    name: portofolio
  path: ./
  # Delete cluster objects that were removed from Git.
  prune: true
  # Report Ready only after the Deployments and StatefulSet are healthy.
  wait: true
