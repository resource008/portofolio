apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portofolio
resources:
  - namespace.yaml
  - infisical.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - gateway.yaml
  - routes.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: portofolio
# Images are promoted by CI and tagged with the main commit SHA.
images:
  - name: ghcr.io/resource008/portofolio-api
    newTag: 8baa8e1ff3734c589e5e33080d36876a20e1b37d
  - name: ghcr.io/resource008/portofolio-web
    newTag: 8baa8e1ff3734c589e5e33080d36876a20e1b37d
