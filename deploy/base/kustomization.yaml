apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portofolio
resources:
  - namespace.yaml
  - infisical.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - gateway.yaml
  - routes.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: portofolio
# Images are promoted by CI and tagged with the main commit SHA.
images:
  - name: ghcr.io/resource008/portofolio-api
    newTag: 1c7e6dd0687ce812486f4ba2313c2d1b3664fbe0
  - name: ghcr.io/resource008/portofolio-web
    newTag: 1c7e6dd0687ce812486f4ba2313c2d1b3664fbe0
