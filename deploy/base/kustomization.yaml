apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portofolio
resources:
  - namespace.yaml
  - infisical.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - gateway.yaml
  - routes.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: portofolio
# Images are promoted by CI and tagged with the main commit SHA.
images:
  - name: ghcr.io/resource008/portofolio-api
    newTag: b98d4b4d74445e6f5ebda3e715d4740ea8e72a9d
  - name: ghcr.io/resource008/portofolio-web
    newTag: b98d4b4d74445e6f5ebda3e715d4740ea8e72a9d
