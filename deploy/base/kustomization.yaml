apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portofolio
resources:
  - namespace.yaml
  - infisical.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - gateway.yaml
  - routes.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: portofolio
# Images are promoted by CI and tagged with the main commit SHA.
images:
  - name: ghcr.io/resource008/portofolio-api
    newTag: 0bd61d16fd1a3eb22e30bc1a2a7588a687cc8ff0
  - name: ghcr.io/resource008/portofolio-web
    newTag: 0bd61d16fd1a3eb22e30bc1a2a7588a687cc8ff0
