apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portofolio
resources:
  - namespace.yaml
  - infisical.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - gateway.yaml
  - routes.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: portofolio
# Images are promoted by CI and tagged with the main commit SHA.
images:
  - name: ghcr.io/resource008/portofolio-api
    newTag: f3ba75a194b4b9c44755f83b5531720109d7d301
  - name: ghcr.io/resource008/portofolio-web
    newTag: f3ba75a194b4b9c44755f83b5531720109d7d301
