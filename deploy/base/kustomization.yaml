apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portofolio
resources:
  - namespace.yaml
  - infisical.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - gateway.yaml
  - routes.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: portofolio
# Images are promoted by CI and tagged with the main commit SHA.
images:
  - name: ghcr.io/resource008/portofolio-api
    newTag: b9f33bbd638ab31813ac452a732b59fc32dfac33
  - name: ghcr.io/resource008/portofolio-web
    newTag: b9f33bbd638ab31813ac452a732b59fc32dfac33
