name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan catches CVEs published after the code last changed.
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject committed .env files
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::.env files must not be committed:"
            echo "$found"
            exit 1
          fi

      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Trivy vulnerabilities (lockfile)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress .

      - name: Trivy misconfiguration (Dockerfiles, workflows)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" \
            config --severity HIGH,CRITICAL --exit-code 1 .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
