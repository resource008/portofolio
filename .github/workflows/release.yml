name: release

# Promote the images that were smoke-tested on dev (no rebuild) and publish deploy/base for Flux.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/resource008

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Find the tested dev commit
        id: src
        run: |
          # A merge commit's second parent is the dev commit that was built and tested.
          if ! dev_sha=$(git rev-parse --verify -q HEAD^2); then
            echo "::error::main HEAD is not a merge commit; nothing tested to promote."
            exit 1
          fi
          if ! git diff --quiet "$dev_sha" HEAD; then
            echo "::error::main differs from the tested dev commit $dev_sha. Update dev from main and merge again."
            exit 1
          fi
          echo "sha=$dev_sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag tested images with the main commit
        env:
          DEV_SHA: ${{ steps.src.outputs.sha }}
        run: |
          for app in api web; do
            docker buildx imagetools create \
              --tag "$REGISTRY/portofolio-$app:$GITHUB_SHA" \
              "$REGISTRY/portofolio-$app:$DEV_SHA"
            echo "- \`$REGISTRY/portofolio-$app:$GITHUB_SHA\` (from \`$DEV_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.10.0

      # Flux in the cluster follows the "main" tag of this artifact, so a merge deploys
      # without a second commit to bump newTag. The bump only happens in this workspace.
      - name: Publish deploy manifests
        run: |
          yq -i '(.images[].newTag) = strenv(GITHUB_SHA)' deploy/base/kustomization.yaml
          artifact="oci://$REGISTRY/portofolio-deploy"
          flux push artifact "$artifact:$GITHUB_SHA" \
            --path=deploy/base \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="$GITHUB_REF_NAME@sha1:$GITHUB_SHA"
          flux tag artifact "$artifact:$GITHUB_SHA" --tag main
          echo "- \`$artifact:$GITHUB_SHA\` (tagged \`main\`)" >> "$GITHUB_STEP_SUMMARY"
